[project]
name = "replay-outbox-events"
version = "0.1.0"
description = "Reset outbox events to PENDING and re-dispatch them to worker-outbox-events"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.1",
    "pytest>=8",
]

[tool.pytest.ini_options]
pythonpath = [".", ".."]
testpaths = ["tests"]
addopts = "-q"
