name: Deploy — Worker Outbox Events

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - staging
    paths:
      - "apps/worker-outbox-events/**"
      - ".github/workflows/deploy-worker-outbox-events.yml"
  pull_request:
    branches:
      - main
      - staging
    paths:
      - "apps/worker-outbox-events/**"

concurrency:
  group: worker-outbox-events-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/worker-outbox-events

jobs:
  # ── CI: lint + test ──────────────────────────────────────────────────────────
  ci:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/worker-outbox-events/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

  # ── Deploy: Staging ──────────────────────────────────────────────────────────
  deploy-staging:
    name: Deploy → Staging
    needs: ci
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/staging') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/staging')
    environment:
      name: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/worker-outbox-events/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Sync Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          QSTASH_URL: ${{ secrets.QSTASH_URL }}
          QSTASH_TOKEN: ${{ secrets.QSTASH_TOKEN }}
          QSTASH_CURRENT_SIGNING_KEY: ${{ secrets.QSTASH_CURRENT_SIGNING_KEY }}
          QSTASH_NEXT_SIGNING_KEY: ${{ secrets.QSTASH_NEXT_SIGNING_KEY }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          WORKER_OUTBOX_EVENTS_URL: ${{ secrets.WORKER_OUTBOX_EVENTS_URL }}
          WORKER_SYNC_URL: ${{ secrets.WORKER_SYNC_URL }}
          WORKER_NOTIFICATION_URL: ${{ secrets.WORKER_NOTIFICATION_URL }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_SCRAPE_SHOPP_SUGG_QUEUE_ID: ${{ secrets.CF_SCRAPE_SHOPP_SUGG_QUEUE_ID }}
          CF_QUEUES_API_TOKEN: ${{ secrets.CF_QUEUES_API_TOKEN }}
        run: |
          node -e '
            const keys = [
              "DATABASE_URL",
              "QSTASH_URL",
              "QSTASH_TOKEN",
              "QSTASH_CURRENT_SIGNING_KEY",
              "QSTASH_NEXT_SIGNING_KEY",
              "UPSTASH_REDIS_REST_URL",
              "UPSTASH_REDIS_REST_TOKEN",
              "REDIS_URL",
              "WORKER_OUTBOX_EVENTS_URL",
              "WORKER_SYNC_URL",
              "WORKER_NOTIFICATION_URL",
              "CF_ACCOUNT_ID",
              "CF_SCRAPE_SHOPP_SUGG_QUEUE_ID",
              "CF_QUEUES_API_TOKEN",
            ];
            const out = Object.fromEntries(
              keys
                .map((k) => [k, process.env[k]])
                .filter(([, v]) => typeof v === "string" && v.length > 0)
            );
            process.stdout.write(JSON.stringify(out));
          ' | npx wrangler secret bulk --env staging

      - name: Deploy to Staging
        run: npm run deploy -- --env staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # ── Deploy: Production ───────────────────────────────────────────────────────
  deploy-production:
    name: Deploy → Production
    needs: ci
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    environment:
      name: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/worker-outbox-events/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Sync Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          QSTASH_URL: ${{ secrets.QSTASH_URL }}
          QSTASH_TOKEN: ${{ secrets.QSTASH_TOKEN }}
          QSTASH_CURRENT_SIGNING_KEY: ${{ secrets.QSTASH_CURRENT_SIGNING_KEY }}
          QSTASH_NEXT_SIGNING_KEY: ${{ secrets.QSTASH_NEXT_SIGNING_KEY }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          WORKER_OUTBOX_EVENTS_URL: ${{ secrets.WORKER_OUTBOX_EVENTS_URL }}
          WORKER_SYNC_URL: ${{ secrets.WORKER_SYNC_URL }}
          WORKER_NOTIFICATION_URL: ${{ secrets.WORKER_NOTIFICATION_URL }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_SCRAPE_SHOPP_SUGG_QUEUE_ID: ${{ secrets.CF_SCRAPE_SHOPP_SUGG_QUEUE_ID }}
          CF_QUEUES_API_TOKEN: ${{ secrets.CF_QUEUES_API_TOKEN }}
        run: |
          node -e '
            const keys = [
              "DATABASE_URL",
              "QSTASH_URL",
              "QSTASH_TOKEN",
              "QSTASH_CURRENT_SIGNING_KEY",
              "QSTASH_NEXT_SIGNING_KEY",
              "UPSTASH_REDIS_REST_URL",
              "UPSTASH_REDIS_REST_TOKEN",
              "REDIS_URL",
              "WORKER_OUTBOX_EVENTS_URL",
              "WORKER_SYNC_URL",
              "WORKER_NOTIFICATION_URL",
              "CF_ACCOUNT_ID",
              "CF_SCRAPE_SHOPP_SUGG_QUEUE_ID",
              "CF_QUEUES_API_TOKEN",
            ];
            const out = Object.fromEntries(
              keys
                .map((k) => [k, process.env[k]])
                .filter(([, v]) => typeof v === "string" && v.length > 0)
            );
            process.stdout.write(JSON.stringify(out));
          ' | npx wrangler secret bulk

      - name: Deploy to Production
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
