name: Deploy — Weekly Outfits Worker

on:
  push:
    branches:
      - main
      - staging
    paths:
      - "apps/upstash-workflow-generate-weekly-outfits/**"
      - ".github/workflows/deploy-weekly-outfits-worker.yml"
  pull_request:
    branches:
      - main
      - staging
    paths:
      - "apps/upstash-workflow-generate-weekly-outfits/**"

concurrency:
  group: weekly-outfits-worker-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/upstash-workflow-generate-weekly-outfits

jobs:
  # ── CI: lint + test ──────────────────────────────────────────────────────────
  ci:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/upstash-workflow-generate-weekly-outfits/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

  # ── Deploy: Staging ──────────────────────────────────────────────────────────
  deploy-staging:
    name: Deploy → Staging
    needs: ci
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    environment:
      name: staging
      url: https://weekly-outfits-worker-staging.${{ secrets.CLOUDFLARE_SUBDOMAIN }}.workers.dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/upstash-workflow-generate-weekly-outfits/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Sync Worker secrets
        run: |
          printf '%s' '${{ toJSON(secrets) }}' \
            | node -e "
                const raw = require('fs').readFileSync('/dev/stdin','utf8');
                const all = JSON.parse(raw);
                const skip = new Set(['CLOUDFLARE_API_TOKEN','CLOUDFLARE_ACCOUNT_ID','CLOUDFLARE_SUBDOMAIN','github_token']);
                const out = Object.fromEntries(Object.entries(all).filter(([k]) => !skip.has(k)));
                process.stdout.write(JSON.stringify(out));
              " \
            | npx wrangler secret bulk --env staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Staging
        run: npm run deploy -- --env staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # ── Deploy: Production ───────────────────────────────────────────────────────
  deploy-production:
    name: Deploy → Production
    needs: ci
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://weekly-outfits-worker.${{ secrets.CLOUDFLARE_SUBDOMAIN }}.workers.dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/upstash-workflow-generate-weekly-outfits/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Sync Worker secrets
        run: |
          printf '%s' '${{ toJSON(secrets) }}' \
            | node -e "
                const raw = require('fs').readFileSync('/dev/stdin','utf8');
                const all = JSON.parse(raw);
                const skip = new Set(['CLOUDFLARE_API_TOKEN','CLOUDFLARE_ACCOUNT_ID','CLOUDFLARE_SUBDOMAIN','github_token']);
                const out = Object.fromEntries(Object.entries(all).filter(([k]) => !skip.has(k)));
                process.stdout.write(JSON.stringify(out));
              " \
            | npx wrangler secret bulk
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Production
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
