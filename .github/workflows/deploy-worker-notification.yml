name: Deploy — Worker Notification

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - staging
    paths:
      - "apps/worker-notification/**"
      - ".github/workflows/deploy-worker-notification.yml"
      - ".github/scripts/sync-wrangler-vars.cjs"
  pull_request:
    branches:
      - main
      - staging
    paths:
      - "apps/worker-notification/**"

concurrency:
  group: worker-notification-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/worker-notification

jobs:
  # ── CI: lint + test ──────────────────────────────────────────────────────────
  ci:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/worker-notification/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test
  # ── Deploy: Staging ──────────────────────────────────────────────────────────
  deploy-staging:
    name: Deploy → Staging
    needs: ci
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/staging') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/staging')
    environment:
      name: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/worker-notification/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Sync Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
          QSTASH_TOKEN: ${{ secrets.QSTASH_TOKEN }}
          QSTASH_CURRENT_SIGNING_KEY: ${{ secrets.QSTASH_CURRENT_SIGNING_KEY }}
          QSTASH_NEXT_SIGNING_KEY: ${{ secrets.QSTASH_NEXT_SIGNING_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
          OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
        run: |
          node -e '
            const keys = ["DATABASE_URL", "DATABASE_URL_UNPOOLED", "QSTASH_TOKEN", "QSTASH_CURRENT_SIGNING_KEY", "QSTASH_NEXT_SIGNING_KEY", "RESEND_API_KEY", "OTEL_EXPORTER_OTLP_ENDPOINT", "OTEL_EXPORTER_OTLP_HEADERS"];
            const out = Object.fromEntries(
              keys
                .map((k) => [k, process.env[k]])
                .filter(([, v]) => typeof v === "string" && v.length > 0)
            );
            process.stdout.write(JSON.stringify(out));
          ' | npx wrangler secret bulk --env staging

      - name: Sync Worker vars
        env:
          TOML_SECTION: '[env.staging.vars]'
          DEPLOYMENT_ENVIRONMENT: staging
          QSTASH_URL: ${{ vars.QSTASH_URL }}
          WORKER_NOTIFICATION_URL: ${{ vars.WORKER_NOTIFICATION_URL }}
          EMAIL_PROVIDER: ${{ vars.EMAIL_PROVIDER }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          EMAIL_REPLY_TO: ${{ vars.EMAIL_REPLY_TO }}
          APP_URL: ${{ vars.APP_URL }}
        run: >
          node "${{ github.workspace }}/.github/scripts/sync-wrangler-vars.cjs"
          DEPLOYMENT_ENVIRONMENT QSTASH_URL WORKER_NOTIFICATION_URL
          EMAIL_PROVIDER EMAIL_FROM EMAIL_REPLY_TO APP_URL

      - name: Deploy to Staging
        run: npm run deploy -- --env staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # ── Deploy: Production ───────────────────────────────────────────────────────
  deploy-production:
    name: Deploy → Production
    needs: ci
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    environment:
      name: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/worker-notification/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Sync Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
          QSTASH_TOKEN: ${{ secrets.QSTASH_TOKEN }}
          QSTASH_CURRENT_SIGNING_KEY: ${{ secrets.QSTASH_CURRENT_SIGNING_KEY }}
          QSTASH_NEXT_SIGNING_KEY: ${{ secrets.QSTASH_NEXT_SIGNING_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
          OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
        run: |
          node -e '
            const keys = ["DATABASE_URL", "DATABASE_URL_UNPOOLED", "QSTASH_TOKEN", "QSTASH_CURRENT_SIGNING_KEY", "QSTASH_NEXT_SIGNING_KEY", "RESEND_API_KEY", "OTEL_EXPORTER_OTLP_ENDPOINT", "OTEL_EXPORTER_OTLP_HEADERS"];
            const out = Object.fromEntries(
              keys
                .map((k) => [k, process.env[k]])
                .filter(([, v]) => typeof v === "string" && v.length > 0)
            );
            process.stdout.write(JSON.stringify(out));
          ' | npx wrangler secret bulk

      - name: Sync Worker vars
        env:
          TOML_SECTION: '[vars]'
          DEPLOYMENT_ENVIRONMENT: production
          QSTASH_URL: ${{ vars.QSTASH_URL }}
          WORKER_NOTIFICATION_URL: ${{ vars.WORKER_NOTIFICATION_URL }}
          EMAIL_PROVIDER: ${{ vars.EMAIL_PROVIDER }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          EMAIL_REPLY_TO: ${{ vars.EMAIL_REPLY_TO }}
          APP_URL: ${{ vars.APP_URL }}
        run: >
          node "${{ github.workspace }}/.github/scripts/sync-wrangler-vars.cjs"
          DEPLOYMENT_ENVIRONMENT QSTASH_URL WORKER_NOTIFICATION_URL
          EMAIL_PROVIDER EMAIL_FROM EMAIL_REPLY_TO APP_URL

      - name: Deploy to Production
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
