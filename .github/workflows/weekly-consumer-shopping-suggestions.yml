name: Weekly — Consumer Shopping Suggestions (ephemeral)

# PAYG: STOPPED VMs still bill for boot volumes. This workflow creates the full
# stack for the Thursday scrape window, then terraform-destroys it (VM + disk + VCN).
#
# America/Sao_Paulo = UTC-3 year-round:
#   Create+deploy  Thu 10:00 BRT → 0 13 * * 4 UTC
#   Destroy        Thu 12:05 BRT → 5 15 * * 4 UTC
#
# Prefer secret TF_BACKEND_HCL (remote state) so create/destroy share the same state.
# Without it, Actions cache (tfstate-css-production-*) is best-effort only.

on:
  schedule:
    - cron: "0 13 * * 4" # create
    - cron: "5 15 * * 4" # destroy
  workflow_dispatch:
    inputs:
      action:
        description: "create = apply+deploy leave RUNNING; destroy = terraform destroy"
        type: choice
        options:
          - create
          - destroy
        default: create

concurrency:
  group: consumer-shopping-suggestions-weekly
  cancel-in-progress: false

defaults:
  run:
    working-directory: apps/consumer-shopping-suggestions

jobs:
  resolve:
    name: Resolve action
    runs-on: ubuntu-latest
    outputs:
      action: ${{ steps.pick.outputs.action }}
    steps:
      - name: Pick create vs destroy
        id: pick
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "action=${{ inputs.action }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # schedule: github.event.schedule is the cron expression that fired
          case "${{ github.event.schedule }}" in
            "5 15 * * 4") echo "action=destroy" >> "$GITHUB_OUTPUT" ;;
            *)            echo "action=create" >> "$GITHUB_OUTPUT" ;;
          esac

  create:
    name: Create stack + deploy (leave RUNNING)
    needs: resolve
    if: needs.resolve.outputs.action == 'create'
    runs-on: ubuntu-latest
    environment:
      name: production
    env:
      IPV6_COUNT: ${{ vars.IPV6_COUNT }}
      PROXY_BASE_PORT: ${{ vars.PROXY_BASE_PORT }}
      INSTANCE_OCPUS: ${{ vars.INSTANCE_OCPUS }}
      INSTANCE_MEMORY_GB: ${{ vars.INSTANCE_MEMORY_GB }}
      AVAILABILITY_DOMAIN_INDEX: ${{ vars.AVAILABILITY_DOMAIN_INDEX }}
      INSTANCE_SHAPE: ${{ vars.INSTANCE_SHAPE }}
      ENABLE_COST_LIMIT: ${{ vars.ENABLE_COST_LIMIT }}
      COST_LIMIT_USD: ${{ vars.COST_LIMIT_USD }}
      COST_ALERT_EMAIL: ${{ secrets.COST_ALERT_EMAIL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/consumer-shopping-suggestions/package-lock.json

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Resolve infra defaults
        id: infra
        run: |
          echo "ipv6_count=${IPV6_COUNT:-4}" >> "$GITHUB_OUTPUT"
          echo "proxy_base_port=${PROXY_BASE_PORT:-11080}" >> "$GITHUB_OUTPUT"
          echo "instance_ocpus=${INSTANCE_OCPUS:-2}" >> "$GITHUB_OUTPUT"
          echo "instance_memory_gb=${INSTANCE_MEMORY_GB:-4}" >> "$GITHUB_OUTPUT"
          echo "ad_index=${AVAILABILITY_DOMAIN_INDEX:-0}" >> "$GITHUB_OUTPUT"
          echo "instance_shape=${INSTANCE_SHAPE:-VM.Standard.A1.Flex}" >> "$GITHUB_OUTPUT"

          LIMIT="${COST_LIMIT_USD:-5}"
          EMAIL="${COST_ALERT_EMAIL:-emmanuel.bergmann@icloud.com}"
          COST_ENABLE="${ENABLE_COST_LIMIT:-}"
          if [ -z "$COST_ENABLE" ]; then
            if [ -n "$EMAIL" ]; then COST_ENABLE="true"; else COST_ENABLE="false"; fi
          fi
          if [ "$COST_ENABLE" = "true" ] && [ -z "$EMAIL" ]; then
            echo "cost_alert_email is required when ENABLE_COST_LIMIT=true" >&2
            exit 1
          fi
          echo "enable_cost_limit=${COST_ENABLE}" >> "$GITHUB_OUTPUT"
          echo "cost_limit_usd=${LIMIT}" >> "$GITHUB_OUTPUT"
          echo "cost_alert_email=${EMAIL}" >> "$GITHUB_OUTPUT"

      - name: Install, build & pack
        run: |
          npm ci --ignore-scripts
          npm run build
          chmod +x deploy/*.sh
          COPYFILE_DISABLE=1 tar -czf consumer-shopping-suggestions.tgz \
            package.json package-lock.json dist deploy .env.example

      - name: Write OCI API key
        working-directory: apps/consumer-shopping-suggestions/deploy/terraform
        run: |
          umask 077
          printf '%s\n' "${{ secrets.OCI_API_PRIVATE_KEY }}" > oci_api_key.pem

      - name: Restore Terraform state
        uses: actions/cache/restore@v4
        with:
          path: apps/consumer-shopping-suggestions/deploy/terraform/terraform.tfstate
          key: tfstate-css-production-${{ github.repository }}
          restore-keys: |
            tfstate-css-production-

      - name: Terraform Init
        working-directory: apps/consumer-shopping-suggestions/deploy/terraform
        run: |
          if [ -n "${{ secrets.TF_BACKEND_HCL }}" ]; then
            printf '%s\n' "${{ secrets.TF_BACKEND_HCL }}" > backend.hcl
            terraform init -input=false -reconfigure -backend-config=backend.hcl
          else
            echo "::warning::TF_BACKEND_HCL unset — using local state + Actions cache (prefer remote state for ephemeral destroy)."
            terraform init -input=false -backend=false
          fi

      - name: Terraform Apply (ephemeral stack)
        id: tf
        working-directory: apps/consumer-shopping-suggestions/deploy/terraform
        env:
          TF_VAR_tenancy_ocid: ${{ secrets.OCI_TENANCY_OCID }}
          TF_VAR_user_ocid: ${{ secrets.OCI_USER_OCID }}
          TF_VAR_fingerprint: ${{ secrets.OCI_FINGERPRINT }}
          TF_VAR_private_key_path: oci_api_key.pem
          TF_VAR_region: ${{ secrets.OCI_REGION }}
          TF_VAR_compartment_ocid: ${{ secrets.OCI_COMPARTMENT_OCID }}
          TF_VAR_ssh_public_key: ${{ secrets.OCI_SSH_PUBLIC_KEY }}
          TF_VAR_ipv6_count: ${{ steps.infra.outputs.ipv6_count }}
          TF_VAR_proxy_base_port: ${{ steps.infra.outputs.proxy_base_port }}
          TF_VAR_instance_ocpus: ${{ steps.infra.outputs.instance_ocpus }}
          TF_VAR_instance_memory_in_gbs: ${{ steps.infra.outputs.instance_memory_gb }}
          TF_VAR_availability_domain_index: ${{ steps.infra.outputs.ad_index }}
          TF_VAR_instance_shape: ${{ steps.infra.outputs.instance_shape }}
          TF_VAR_enable_cost_limit: ${{ steps.infra.outputs.enable_cost_limit }}
          TF_VAR_cost_limit_usd: ${{ steps.infra.outputs.cost_limit_usd }}
          TF_VAR_cost_alert_email: ${{ steps.infra.outputs.cost_alert_email }}
          TF_VAR_environment: production
        run: |
          terraform apply -auto-approve -input=false
          terraform output -raw ipv6_pool_file > /tmp/ipv6-addresses.txt
          {
            echo "instance_public_ip=$(terraform output -raw instance_public_ip)"
            echo "ssh_user=$(terraform output -raw ssh_user)"
            echo "instance_ocid=$(terraform output -raw instance_ocid)"
          } >> "$GITHUB_OUTPUT"
          echo "VM $(terraform output -raw instance_ocid) @ $(terraform output -raw instance_public_ip)"
          echo "ephemeral weekly create — VM left RUNNING until destroy cron"

      - name: Save Terraform state
        if: success()
        uses: actions/cache/save@v4
        with:
          path: apps/consumer-shopping-suggestions/deploy/terraform/terraform.tfstate
          key: tfstate-css-production-${{ github.repository }}-${{ github.run_id }}

      - name: Ensure VM is RUNNING
        working-directory: apps/consumer-shopping-suggestions
        env:
          OCI_INSTANCE_OCID: ${{ steps.tf.outputs.instance_ocid }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_API_PRIVATE_KEY_PATH: deploy/terraform/oci_api_key.pem
        run: |
          pip install --quiet oci
          python3 deploy/oci_instance_action.py START --wait

      - name: Wait for SSH
        env:
          HOST: ${{ steps.tf.outputs.instance_public_ip }}
        run: |
          echo "Waiting for SSH on ${HOST}:22 ..."
          for i in $(seq 1 60); do
            if nc -z -w 3 "$HOST" 22; then
              echo "SSH is up"
              exit 0
            fi
            sleep 5
          done
          echo "Timed out waiting for SSH" >&2
          exit 1

      - name: Stage SCP artifacts
        run: |
          mkdir -p /tmp/skydiiv-upload
          cp consumer-shopping-suggestions.tgz /tmp/skydiiv-upload/
          cp /tmp/ipv6-addresses.txt /tmp/skydiiv-upload/

      - name: Upload release + IPv6 pool to Oracle VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ steps.tf.outputs.instance_public_ip }}
          username: ${{ steps.tf.outputs.ssh_user }}
          key: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
          port: 22
          source: /tmp/skydiiv-upload/consumer-shopping-suggestions.tgz,/tmp/skydiiv-upload/ipv6-addresses.txt
          target: /tmp/skydiiv-deploy/
          strip_components: 2
          overwrite: true

      - name: Remote deploy (fully automated)
        uses: appleboy/ssh-action@v1.2.0
        env:
          PROXY_BASE_PORT: ${{ steps.infra.outputs.proxy_base_port }}
        with:
          host: ${{ steps.tf.outputs.instance_public_ip }}
          username: ${{ steps.tf.outputs.ssh_user }}
          key: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
          port: 22
          envs: PROXY_BASE_PORT
          script: |
            set -euo pipefail
            sudo mkdir -p /etc/skydiiv /var/lib/skydiiv/proxy-pool /opt/skydiiv/consumer-shopping-suggestions

            if [ -n "${{ secrets.CONSUMER_SHOPPING_SUGGESTIONS_ENV }}" ]; then
              sudo tee /etc/skydiiv/consumer-shopping-suggestions.env >/dev/null <<'EOF'
            ${{ secrets.CONSUMER_SHOPPING_SUGGESTIONS_ENV }}
            EOF
              sudo chmod 600 /etc/skydiiv/consumer-shopping-suggestions.env
            else
              sudo touch /etc/skydiiv/consumer-shopping-suggestions.env
              sudo chmod 600 /etc/skydiiv/consumer-shopping-suggestions.env
            fi

            IPV6_SRC="$(find /tmp/skydiiv-deploy -name 'ipv6-addresses.txt' | head -n1)"
            TARBALL="$(find /tmp/skydiiv-deploy -name 'consumer-shopping-suggestions.tgz' | head -n1)"
            test -n "${IPV6_SRC}" && test -n "${TARBALL}"

            sudo install -m 644 "${IPV6_SRC}" /var/lib/skydiiv/proxy-pool/ipv6-addresses.txt
            sudo tar -xzf "${TARBALL}" -C /opt/skydiiv/consumer-shopping-suggestions

            cd /opt/skydiiv/consumer-shopping-suggestions
            sudo PROXY_BASE_PORT="${PROXY_BASE_PORT}" \
              IPV6_POOL_FILE=/var/lib/skydiiv/proxy-pool/ipv6-addresses.txt \
              bash deploy/remote-deploy.sh

      - name: Summary
        run: |
          echo "### Weekly create complete" >> "$GITHUB_STEP_SUMMARY"
          echo "VM left **RUNNING** until destroy cron (Thu 12:05 BRT / 15:05 UTC)." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Host: \`${{ steps.tf.outputs.ssh_user }}@${{ steps.tf.outputs.instance_public_ip }}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup OCI key
        if: always()
        working-directory: apps/consumer-shopping-suggestions/deploy/terraform
        run: rm -f oci_api_key.pem backend.hcl

  destroy:
    name: Destroy stack (VM + boot volume + network)
    needs: resolve
    if: needs.resolve.outputs.action == 'destroy'
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Write OCI API key
        working-directory: apps/consumer-shopping-suggestions/deploy/terraform
        run: |
          umask 077
          printf '%s\n' "${{ secrets.OCI_API_PRIVATE_KEY }}" > oci_api_key.pem

      - name: Restore Terraform state
        uses: actions/cache/restore@v4
        with:
          path: apps/consumer-shopping-suggestions/deploy/terraform/terraform.tfstate
          key: tfstate-css-production-${{ github.repository }}
          restore-keys: |
            tfstate-css-production-

      - name: Terraform Init
        id: tf
        working-directory: apps/consumer-shopping-suggestions/deploy/terraform
        run: |
          if [ -n "${{ secrets.TF_BACKEND_HCL }}" ]; then
            printf '%s\n' "${{ secrets.TF_BACKEND_HCL }}" > backend.hcl
            terraform init -input=false -reconfigure -backend-config=backend.hcl
          else
            echo "::warning::TF_BACKEND_HCL unset — using local state + Actions cache."
            terraform init -input=false -backend=false
          fi

          HAS_STATE="false"
          if terraform state list 2>/dev/null | grep -q .; then
            HAS_STATE="true"
          elif [ -f terraform.tfstate ] && [ -s terraform.tfstate ]; then
            HAS_STATE="true"
          fi
          echo "has_state=${HAS_STATE}" >> "$GITHUB_OUTPUT"
          if [ "$HAS_STATE" != "true" ]; then
            echo "No Terraform state — nothing to destroy"
          fi

      - name: Terraform Destroy
        if: steps.tf.outputs.has_state == 'true'
        working-directory: apps/consumer-shopping-suggestions/deploy/terraform
        env:
          TF_VAR_tenancy_ocid: ${{ secrets.OCI_TENANCY_OCID }}
          TF_VAR_user_ocid: ${{ secrets.OCI_USER_OCID }}
          TF_VAR_fingerprint: ${{ secrets.OCI_FINGERPRINT }}
          TF_VAR_private_key_path: oci_api_key.pem
          TF_VAR_region: ${{ secrets.OCI_REGION }}
          TF_VAR_compartment_ocid: ${{ secrets.OCI_COMPARTMENT_OCID }}
          TF_VAR_ssh_public_key: ${{ secrets.OCI_SSH_PUBLIC_KEY }}
          TF_VAR_environment: production
        run: |
          terraform destroy -auto-approve -input=false
          echo "Stack destroyed — VM, boot volume, VCN, IPv6 removed"

      - name: Persist emptied Terraform state
        if: success() && steps.tf.outputs.has_state == 'true'
        uses: actions/cache/save@v4
        with:
          path: apps/consumer-shopping-suggestions/deploy/terraform/terraform.tfstate
          key: tfstate-css-production-${{ github.repository }}-${{ github.run_id }}

      - name: Summary
        run: |
          echo "### Weekly destroy complete" >> "$GITHUB_STEP_SUMMARY"
          echo "No OCI compute/boot volume should remain for this stack." >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup OCI key
        if: always()
        working-directory: apps/consumer-shopping-suggestions/deploy/terraform
        run: rm -f oci_api_key.pem backend.hcl
