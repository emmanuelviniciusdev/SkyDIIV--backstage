name: Deploy — Worker AI Workflows

on:
  push:
    branches:
      - main
      - staging
    paths:
      - "apps/worker-ai-workflows/**"
      - ".github/workflows/deploy-worker-ai-workflows.yml"
  pull_request:
    branches:
      - main
      - staging
    paths:
      - "apps/worker-ai-workflows/**"

concurrency:
  group: worker-ai-workflows-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/worker-ai-workflows

jobs:
  # ── CI: lint + test ──────────────────────────────────────────────────────────
  ci:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/worker-ai-workflows/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

  # ── Deploy: Staging ──────────────────────────────────────────────────────────
  deploy-staging:
    name: Deploy → Staging
    needs: ci
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    environment:
      name: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/worker-ai-workflows/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Sync Worker secrets
        run: |
          printf '%s' '${{ toJSON(secrets) }}' \
            | node -e "
                const raw = require('fs').readFileSync('/dev/stdin','utf8');
                const all = JSON.parse(raw);
                const skip = new Set(['CLOUDFLARE_API_TOKEN','CLOUDFLARE_ACCOUNT_ID','CLOUDFLARE_SUBDOMAIN','github_token']);
                const out = Object.fromEntries(Object.entries(all).filter(([k]) => !skip.has(k)));
                process.stdout.write(JSON.stringify(out));
              " \
            | npx wrangler secret bulk --env staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Sync Worker vars
        env:
          ALL_VARS: ${{ toJSON(vars) }}
          TOML_SECTION: '[env.staging.vars]'
        run: |
          node -e "
            const fs = require('fs');
            const all = JSON.parse(process.env.ALL_VARS);
            const skip = new Set(['CLOUDFLARE_API_TOKEN','CLOUDFLARE_ACCOUNT_ID','CLOUDFLARE_SUBDOMAIN','github_token']);
            const entries = Object.entries(all).filter(([k]) => !skip.has(k));
            if (!entries.length) process.exit(0);
            const lines = entries.map(([k,v]) => k + ' = ' + JSON.stringify(String(v))).join('\n');
            const header = process.env.TOML_SECTION;
            let toml = fs.readFileSync('wrangler.toml', 'utf8');
            const rows = toml.split('\n');
            const idx = rows.findIndex(l => l.trim() === header);
            if (idx >= 0) {
              rows.splice(idx + 1, 0, lines);
              toml = rows.join('\n');
            } else {
              toml = toml.trimEnd() + '\n\n' + header + '\n' + lines + '\n';
            }
            fs.writeFileSync('wrangler.toml', toml);
          "

      - name: Deploy to Staging
        run: npm run deploy -- --env staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # ── Deploy: Production ───────────────────────────────────────────────────────
  deploy-production:
    name: Deploy → Production
    needs: ci
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/worker-ai-workflows/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Sync Worker secrets
        run: |
          printf '%s' '${{ toJSON(secrets) }}' \
            | node -e "
                const raw = require('fs').readFileSync('/dev/stdin','utf8');
                const all = JSON.parse(raw);
                const skip = new Set(['CLOUDFLARE_API_TOKEN','CLOUDFLARE_ACCOUNT_ID','CLOUDFLARE_SUBDOMAIN','github_token']);
                const out = Object.fromEntries(Object.entries(all).filter(([k]) => !skip.has(k)));
                process.stdout.write(JSON.stringify(out));
              " \
            | npx wrangler secret bulk
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Sync Worker vars
        env:
          ALL_VARS: ${{ toJSON(vars) }}
          TOML_SECTION: '[vars]'
        run: |
          node -e "
            const fs = require('fs');
            const all = JSON.parse(process.env.ALL_VARS);
            const skip = new Set(['CLOUDFLARE_API_TOKEN','CLOUDFLARE_ACCOUNT_ID','CLOUDFLARE_SUBDOMAIN','github_token']);
            const entries = Object.entries(all).filter(([k]) => !skip.has(k));
            if (!entries.length) process.exit(0);
            const lines = entries.map(([k,v]) => k + ' = ' + JSON.stringify(String(v))).join('\n');
            const header = process.env.TOML_SECTION;
            let toml = fs.readFileSync('wrangler.toml', 'utf8');
            const rows = toml.split('\n');
            const idx = rows.findIndex(l => l.trim() === header);
            if (idx >= 0) {
              rows.splice(idx + 1, 0, lines);
              toml = rows.join('\n');
            } else {
              toml = toml.trimEnd() + '\n\n' + header + '\n' + lines + '\n';
            }
            fs.writeFileSync('wrangler.toml', toml);
          "

      - name: Deploy to Production
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
