name: Cost guard — Robot Shopping Suggestions

# Enforces the monthly OCI cost ceiling by destroying the robot Terraform stack
# (Container Instance, VCN, budget, …) when spend >= limit.
# OCI Budgets only email; this workflow is the hard kill switch.

on:
  schedule:
    # Once per day at 12:00 UTC (09:00 America/Sao_Paulo). Usage API can lag ~hours.
    - cron: "0 12 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report only (do not destroy infra)"
        type: boolean
        default: false

concurrency:
  group: robot-cost-guard
  cancel-in-progress: false

jobs:
  cost-guard:
    name: Enforce cost limit
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Install OCI SDK
        run: pip install --quiet oci

      - name: Write OCI API key
        working-directory: apps/robot-shopping-suggestions/deploy/terraform
        run: |
          umask 077
          printf '%s\n' "${{ secrets.OCI_API_PRIVATE_KEY }}" > oci_api_key.pem

      - name: Terraform Init
        working-directory: apps/robot-shopping-suggestions
        env:
          TF_BACKEND_HCL: ${{ secrets.TF_BACKEND_HCL }}
          TF_BACKEND_HCL_B64: ${{ secrets.TF_BACKEND_HCL_B64 }}
        run: ./deploy/terraform-init.sh

      - name: Check Terraform state
        id: tf
        working-directory: apps/robot-shopping-suggestions/deploy/terraform
        env:
          TF_VAR_tenancy_ocid: ${{ secrets.OCI_TENANCY_OCID }}
          TF_VAR_user_ocid: ${{ secrets.OCI_USER_OCID }}
          TF_VAR_fingerprint: ${{ secrets.OCI_FINGERPRINT }}
          TF_VAR_private_key_path: oci_api_key.pem
          TF_VAR_region: ${{ secrets.OCI_REGION }}
          TF_VAR_compartment_ocid: ${{ secrets.OCI_COMPARTMENT_OCID }}
          TF_VAR_container_image_url: "placeholder.invalid/robot:cost-guard"
          TF_VAR_robot_env: "{}"
        run: |
          HAS_STATE="false"
          if terraform state list 2>/dev/null | grep -q .; then
            HAS_STATE="true"
          fi
          echo "has_state=${HAS_STATE}" >> "$GITHUB_OUTPUT"

          # Prefer -json: -raw prints "│ Warning: No outputs found" to stdout when
          # the remote state is empty, which breaks GITHUB_OUTPUT (multiline / │).
          INSTANCE_OCID="$(
            terraform output -json 2>/dev/null | python3 -c '
          import json, sys
          try:
              data = json.load(sys.stdin)
          except Exception:
              raise SystemExit(0)
          value = (data.get("instance_ocid") or {}).get("value")
          if isinstance(value, str) and value.startswith("ocid1."):
              print(value, end="")
          ' || true
          )"
          if [ -z "$INSTANCE_OCID" ] && [ -n "${{ secrets.OCI_INSTANCE_OCID }}" ]; then
            INSTANCE_OCID="${{ secrets.OCI_INSTANCE_OCID }}"
          fi
          # Last-resort sanitize: never write terraform UI / newlines into GITHUB_OUTPUT.
          case "$INSTANCE_OCID" in
            ocid1.*) ;;
            *) INSTANCE_OCID="" ;;
          esac
          echo "instance_ocid=${INSTANCE_OCID}" >> "$GITHUB_OUTPUT"

          if [ "$HAS_STATE" != "true" ] && [ -z "$INSTANCE_OCID" ]; then
            echo "No Terraform state and no instance OCID — skipping cost guard" >&2
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run cost guard (destroy stack if over limit)
        id: guard
        if: steps.tf.outputs.skip != 'true'
        working-directory: apps/robot-shopping-suggestions
        env:
          OCI_INSTANCE_OCID: ${{ steps.tf.outputs.instance_ocid }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_API_PRIVATE_KEY_PATH: deploy/terraform/oci_api_key.pem
          OCI_REGION: ${{ secrets.OCI_REGION }}
          OCI_COMPARTMENT_OCID: ${{ secrets.OCI_COMPARTMENT_OCID }}
          COST_LIMIT_USD: ${{ vars.COST_LIMIT_USD }}
          # Terraform destroy runs with cwd=deploy/terraform
          TF_VAR_tenancy_ocid: ${{ secrets.OCI_TENANCY_OCID }}
          TF_VAR_user_ocid: ${{ secrets.OCI_USER_OCID }}
          TF_VAR_fingerprint: ${{ secrets.OCI_FINGERPRINT }}
          TF_VAR_private_key_path: oci_api_key.pem
          TF_VAR_region: ${{ secrets.OCI_REGION }}
          TF_VAR_compartment_ocid: ${{ secrets.OCI_COMPARTMENT_OCID }}
          TF_VAR_container_image_url: "placeholder.invalid/robot:cost-guard"
          TF_VAR_robot_env: "{}"
          TF_VAR_environment: production
        run: |
          LIMIT="${COST_LIMIT_USD:-5}"
          EXTRA=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            EXTRA="--dry-run"
          fi
          set +e
          python3 deploy/oci_cost_guard.py \
            --limit "${LIMIT}" \
            --terraform-dir deploy/terraform \
            ${EXTRA}
          CODE=$?
          set -e
          echo "exit_code=${CODE}" >> "$GITHUB_OUTPUT"
          exit "${CODE}"

      - name: Cleanup OCI key
        if: always()
        working-directory: apps/robot-shopping-suggestions/deploy/terraform
        run: rm -f oci_api_key.pem backend.hcl
