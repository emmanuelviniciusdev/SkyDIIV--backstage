name: Deploy — Robot Scrape Products

# CI on PR/push. Production ephemeral runs use the weekly create/destroy workflow.
# Manual dispatch can push a fresh OCIR image without creating the Container Instance.

on:
  pull_request:
    paths:
      - "apps/robot-scrape-products/**"
      - ".github/workflows/deploy-robot-scrape-products.yml"
  push:
    branches: [main, staging]
    paths:
      - "apps/robot-scrape-products/**"
      - ".github/workflows/deploy-robot-scrape-products.yml"
  workflow_dispatch:
    inputs:
      push_image:
        description: "Build and push OCIR image (tag = git sha + latest)"
        type: boolean
        default: false

concurrency:
  group: robot-scrape-products-deploy-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/robot-scrape-products

jobs:
  ci:
    name: Lint, test & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/robot-scrape-products/package-lock.json

      - name: Install
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  push-ocir:
    name: Push OCIR image
    needs: ci
    if: github.event_name == 'workflow_dispatch' && inputs.push_image == true
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'staging' && 'staging' || 'production' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The region-id host is what the local deploy and the Container Instance
      # pull use; oracle-actions/login-ocir only authenticates the region-key
      # host (iad.ocir.io) and docker credentials are stored per host.
      - name: Log in to OCIR
        env:
          OCIR_AUTH_TOKEN: ${{ secrets.OCIR_AUTH_TOKEN }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
          OCIR_USERNAME: ${{ secrets.OCIR_USERNAME }}
        run: |
          echo "$OCIR_AUTH_TOKEN" | docker login "${OCI_REGION}.ocir.io" \
            -u "$OCIR_USERNAME" \
            --password-stdin

      - name: Build & push
        working-directory: apps/robot-scrape-products
        env:
          REGION: ${{ secrets.OCI_REGION }}
          NS: ${{ secrets.OCIR_NAMESPACE }}
        run: |
          IMAGE="${REGION}.ocir.io/${NS}/robot-scrape-products:${{ github.sha }}"
          LATEST="${REGION}.ocir.io/${NS}/robot-scrape-products:latest"
          docker build \
            --build-arg GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }} \
            -t "$IMAGE" -t "$LATEST" .
          docker push "$IMAGE"
          docker push "$LATEST"
          echo "### Pushed" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`$IMAGE\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`$LATEST\`" >> "$GITHUB_STEP_SUMMARY"
