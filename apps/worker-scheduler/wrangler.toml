name = "worker-scheduler"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# nodejs_compat enables:
#   - process.env (populated from Worker bindings below)
#   - other Node.js built-ins used by dependencies (postgres.js, @upstash/qstash)
compatibility_flags = ["nodejs_compat"]

[vars]
DEPLOYMENT_ENVIRONMENT = "production"

[observability.logs]
enabled = true
invocation_logs = true

# ── Secrets ───────────────────────────────────────────────────────────────────
# Set each secret once with: wrangler secret put <KEY>
#
#   wrangler secret put DATABASE_URL
#   wrangler secret put QSTASH_URL
#   wrangler secret put QSTASH_TOKEN
#   wrangler secret put QSTASH_CURRENT_SIGNING_KEY
#   wrangler secret put QSTASH_NEXT_SIGNING_KEY
#   wrangler secret put WORKER_AI_WORKFLOWS_URL
#   wrangler secret put WORKER_OUTBOX_EVENTS_URL
#   wrangler secret put NEON_API_KEY
#   wrangler secret put NEON_PROJECT_ID
#   wrangler secret put NEON_BRANCH_ID
#
# ── Observability (Grafana Cloud OTLP) ────────────────────────────────────────
#   wrangler secret put OTEL_EXPORTER_OTLP_ENDPOINT
#   wrangler secret put OTEL_EXPORTER_OTLP_HEADERS
# Optional vars: OBSERVABILITY_PROVIDER (grafana-cloud|noop), OTEL_SERVICE_NAME
# See docs/OBSERVABILITY.md.
#
# Optional var (can also be set as a Worker var):
#   OUTBOX_CATCHUP_MIN_AGE_MINUTES=10
#
# ── Staging / preview environment ─────────────────────────────────────────────
[env.staging]
name = "worker-scheduler-staging"

[env.staging.vars]
DEPLOYMENT_ENVIRONMENT = "staging"
