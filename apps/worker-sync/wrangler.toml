name = "worker-sync"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# nodejs_compat enables:
#   - crypto.randomUUID()
#   - process.env (populated from Worker bindings below)
#   - other Node.js built-ins used by dependencies
compatibility_flags = ["nodejs_compat"]

# ── Secrets ───────────────────────────────────────────────────────────────────
# Set each secret once with: wrangler secret put <KEY>
#
#   wrangler secret put DATABASE_URL
#   wrangler secret put DATABASE_URL_UNPOOLED
#   wrangler secret put QSTASH_URL
#   wrangler secret put QSTASH_TOKEN
#   wrangler secret put QSTASH_CURRENT_SIGNING_KEY
#   wrangler secret put QSTASH_NEXT_SIGNING_KEY
#
# Worker-specific Upstash Workflow callback origin.
#   wrangler secret put WORKER_SYNC_URL
#
# ── Redis ─────────────────────────────────────────────────────────────────────
#   wrangler secret put UPSTASH_REDIS_REST_URL
#   wrangler secret put UPSTASH_REDIS_REST_TOKEN
#   # or:
#   wrangler secret put REDIS_URL
#
# ── LLM ───────────────────────────────────────────────────────────────────────
#   wrangler secret put GEMINI_API_KEY
#
# ── Observability (Grafana Cloud OTLP) ────────────────────────────────────────
#   wrangler secret put OTEL_EXPORTER_OTLP_ENDPOINT
#   wrangler secret put OTEL_EXPORTER_OTLP_HEADERS
# See docs/OBSERVABILITY.md.
#
# DEPLOYMENT_ENVIRONMENT is hardcoded by the deploy workflow (production on
# main, staging on the staging branch). [vars] / [env.staging.vars] keep the
# same values for manual deploys; .dev.vars sets local.
# It selects the field-encryption key source: production and staging load the
# key database; local or unset uses the local test vectors. There is no ENCRYPTION_KEY_SOURCE.
# See docs/FIELD_ENCRYPTION.md.
#
# ── Field encryption (encryption_keys) ────────────────────────────────────────
# Secrets (wrangler secret put). Required when DEPLOYMENT_ENVIRONMENT is
# production or staging. Do not put KEK material in [vars].
#   wrangler secret put CLOUDFLARE_ACCOUNT_ID
#   wrangler secret put CLOUDFLARE_D1_ENCRYPTION_DATABASE_ID
#   wrangler secret put CLOUDFLARE_D1_API_TOKEN

[vars]
LLM_PROVIDER = "gemini_flash"
# GEMINI_MODEL = "gemini-2.5-flash"
DEPLOYMENT_ENVIRONMENT = "production"

[observability.logs]
enabled = true
invocation_logs = true

# ── Staging / preview environment ─────────────────────────────────────────────
[env.staging]
name = "worker-sync-staging"

[env.staging.vars]
LLM_PROVIDER = "gemini_flash"
DEPLOYMENT_ENVIRONMENT = "staging"
