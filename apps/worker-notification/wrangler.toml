name = "worker-notification"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# nodejs_compat enables:
#   - crypto.randomUUID()
#   - process.env (populated from Worker bindings below)
#   - other Node.js built-ins used by dependencies (postgres.js, @upstash/qstash)
compatibility_flags = ["nodejs_compat"]

# ── Secrets ───────────────────────────────────────────────────────────────────
# Set each secret once with: wrangler secret put <KEY>
#
#   wrangler secret put DATABASE_URL
#   wrangler secret put DATABASE_URL_UNPOOLED
#   wrangler secret put QSTASH_URL
#   wrangler secret put QSTASH_TOKEN
#   wrangler secret put QSTASH_CURRENT_SIGNING_KEY
#   wrangler secret put QSTASH_NEXT_SIGNING_KEY
#
# Worker-specific Upstash Workflow callback origin.
#   wrangler secret put WORKER_NOTIFICATION_URL
#
# ── Email (Resend) ──────────────────────────────────────────────────────────────
#   wrangler secret put RESEND_API_KEY
#
# ── Vars (non-secrets) ────────────────────────────────────────────────────────
# Injected at deploy from GitHub Environment *variables* (not secrets):
#   EMAIL_PROVIDER, EMAIL_FROM, APP_URL
# See README → Deployment → First-time setup.

[observability.logs]
enabled = true
invocation_logs = true

# ── Staging / preview environment ─────────────────────────────────────────────
[env.staging]
name = "worker-notification-staging"
