# Local development — Cloudflare Queues only.
#
#   cp .env.example .env   # fill CF_* + DATABASE_URL
#   docker compose up --build
#
# Publish an event (another terminal):
#   ./scripts/publish-event.sh
#
# Note: create `.env` before `docker compose up` — the file is mounted into the
# container and loaded via `node --env-file` (same as `npm run dev` on the host).

services:
  consumer:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    volumes:
      - ./.env:/app/.env:ro
    command: ["node", "--env-file=/app/.env", "dist/main.js"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Docker-only overrides (take precedence over .env — keep this list minimal)
      CONSUMER_CONCURRENCY: "2"
      CAMOUFOX_HEADLESS: "true"
      CAMOUFOX_INSTALL_DIR: /opt/camoufox
      LOG_LEVEL: DEBUG
    shm_size: "2gb"
    restart: unless-stopped
